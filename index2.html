    <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .grid-item {
      background-color: #f1f1f1;
      border: 1px solid #ccc;
      padding: 10px;
      border-radius: 8px;
      overflow: hidden;
    }

    .grid-item img,
    .grid-item video {
      width: 100%;
      height: auto;
      border-radius: 6px;
      display: block;
    }

    .grid-item video {
      max-height: 300px;
    }

    @media (max-width: 600px) {
      .grid-item video {
        max-height: 200px;
      }
    }
  </style>
</head>
